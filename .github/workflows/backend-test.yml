name: backend-CI

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']

jobs:
    backend-test:
        name: backend test cases
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v6
            
            - name: setup python
              uses: actions/setup-python@v5

            - name: install dependencies
              run: | 
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            - name: run test
              run: pytest